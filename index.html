<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphRoots Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>GraphRoots Viewer</h1>
            <p>GraphQL explorer for stored computational graphs</p>
          </div>
        </div>
        <label class="api-field">
          <span>GraphQL</span>
          <input id="api-url" type="text" spellcheck="false" placeholder="/graphql" />
        </label>
        <div id="api-status" class="status" data-state="idle">Idle</div>
      </header>

      <aside class="panel documents">
        <div class="documents-toolbar">
          <div class="panel-head">
            <h2>Documents</h2>
            <button id="refresh" type="button">Refresh</button>
          </div>
          <label class="doc-search">
            <input id="doc-filter" type="search" placeholder="Filter definitions…" aria-label="Filter definitions" autocomplete="off" />
          </label>
        </div>
        <p id="doc-summary" class="muted">Loading…</p>
        <ul id="doc-list" class="doc-list"></ul>
      </aside>

      <main class="canvas-wrap" data-view="canvas">
        <div class="canvas-toolbar">
          <div class="view-toggle" role="group" aria-label="View mode">
            <button id="view-canvas" type="button" class="is-active" aria-pressed="true">Canvas</button>
            <button id="view-graph" type="button" aria-pressed="false">Graph</button>
          </div>
          <input id="node-filter" type="search" placeholder="Filter nodes…" />
          <button id="fit" type="button">Fit</button>
          <label class="compare-field">
            <span>Compare with</span>
            <select id="compare-select" disabled>
              <option value="">No other versions</option>
            </select>
          </label>
          <span id="view-hint" class="muted">Drag a node to move it</span>
          <span id="graph-meta" class="muted"></span>
        </div>
        <svg id="canvas" role="img" aria-label="Component canvas"></svg>
        <svg id="graph" role="img" aria-label="Definition graph"></svg>
        <div class="graph-legend" aria-hidden="true">
          <span><i class="swatch kind-operator"></i>Operator</span>
          <span><i class="swatch kind-parameter"></i>Parameter</span>
          <span><i class="swatch kind-group"></i>Group</span>
          <span><i class="swatch kind-annotation"></i>Annotation</span>
          <span><i class="swatch kind-cluster"></i>Cluster</span>
        </div>
        <div class="diff-legend" aria-hidden="true">
          <span><i class="swatch diff-added"></i>Added</span>
          <span><i class="swatch diff-removed"></i>Removed</span>
          <span><i class="swatch diff-changed"></i>Changed</span>
        </div>
        <p id="canvas-hint" class="canvas-hint">Select a document to draw its graph.</p>
      </main>

      <aside class="panel inspector">
        <div class="panel-head">
          <h2 id="inspector-title">Properties</h2>
        </div>
        <div id="inspector" class="inspector-body">
          <p class="muted">Select a document, node, port, or edge.</p>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
